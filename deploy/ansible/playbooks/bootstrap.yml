---
- name: Bootstrap an Ubuntu or Debian VPS for ArkiWatch
  hosts: arkiwatch
  become: true
  vars:
    arkiwatch_remote_root: /srv/arkiwatch
    arkiwatch_deploy_user: deploy
    arkiwatch_ssh_public_key_file: "{{ lookup('env', 'HOME') + '/.ssh/id_ed25519.pub' }}"
    arkiwatch_ssh_public_key: "{{ lookup('file', arkiwatch_ssh_public_key_file, errors='ignore') | trim }}"
    docker_apt_distribution: "{{ ansible_facts['distribution'] | lower }}"
    docker_apt_arch: "{{ 'arm64' if ansible_facts['architecture'] in ['aarch64', 'arm64'] else 'amd64' }}"

  pre_tasks:
    - name: Ensure the target OS is supported
      ansible.builtin.assert:
        that:
          - ansible_facts['distribution'] in ['Ubuntu', 'Debian']
        fail_msg: "This bootstrap playbook supports Ubuntu and Debian only."

    - name: Ensure an SSH public key is available for the deploy user
      ansible.builtin.assert:
        that:
          - arkiwatch_ssh_public_key | length > 0
        fail_msg: "Set arkiwatch_ssh_public_key_file or create ~/.ssh/id_ed25519.pub on your Mac."

  tasks:
    - name: Install base packages
      ansible.builtin.apt:
        name:
          - ca-certificates
          - curl
          - gnupg
          - rsync
          - restic
          - ufw
        state: present
        update_cache: true

    - name: Remove distro Docker packages that conflict with Docker CE
      ansible.builtin.apt:
        name:
          - docker.io
          - docker-compose
          - docker-compose-v2
          - docker-doc
          - podman-docker
          - containerd
          - runc
        state: absent
        purge: true

    - name: Create Docker apt keyring directory
      ansible.builtin.file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: Install Docker apt signing key
      ansible.builtin.get_url:
        url: "https://download.docker.com/linux/{{ docker_apt_distribution }}/gpg"
        dest: /etc/apt/keyrings/docker.asc
        mode: "0644"

    - name: Add Docker apt repository
      ansible.builtin.apt_repository:
        repo: "deb [arch={{ docker_apt_arch }} signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/{{ docker_apt_distribution }} {{ ansible_facts['distribution_release'] }} stable"
        filename: docker
        state: present

    - name: Install Docker Engine and Compose plugin
      ansible.builtin.apt:
        name:
          - docker-ce
          - docker-ce-cli
          - containerd.io
          - docker-buildx-plugin
          - docker-compose-plugin
        state: present
        update_cache: true

    - name: Enable Docker service
      ansible.builtin.service:
        name: docker
        enabled: true
        state: started

    - name: Create deploy user
      ansible.builtin.user:
        name: "{{ arkiwatch_deploy_user }}"
        shell: /bin/bash
        groups:
          - docker
          - sudo
        append: true
        create_home: true

    - name: Authorize deploy SSH key
      ansible.posix.authorized_key:
        user: "{{ arkiwatch_deploy_user }}"
        key: "{{ arkiwatch_ssh_public_key | trim }}"
        state: present

    - name: Create ArkiWatch directories
      ansible.builtin.file:
        path: "{{ item }}"
        state: directory
        owner: "{{ arkiwatch_deploy_user }}"
        group: "{{ arkiwatch_deploy_user }}"
        mode: "0750"
      loop:
        - "{{ arkiwatch_remote_root }}"
        - "{{ arkiwatch_remote_root }}/runtime"
        - "{{ arkiwatch_remote_root }}/runtime/compose"
        - "{{ arkiwatch_remote_root }}/runtime/caddy"
        - "{{ arkiwatch_remote_root }}/runtime/scripts"
        - "{{ arkiwatch_remote_root }}/env"
        - "{{ arkiwatch_remote_root }}/backups"
        - "{{ arkiwatch_remote_root }}/backups/postgres"
        - "{{ arkiwatch_remote_root }}/logs"

    - name: Allow SSH through UFW
      community.general.ufw:
        rule: allow
        port: "{{ ansible_port | default(22) }}"
        proto: tcp

    - name: Allow HTTP through UFW
      community.general.ufw:
        rule: allow
        port: "80"
        proto: tcp

    - name: Allow HTTPS through UFW
      community.general.ufw:
        rule: allow
        port: "443"
        proto: tcp

    - name: Enable UFW
      community.general.ufw:
        state: enabled
        policy: deny
