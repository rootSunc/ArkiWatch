---
- name: Run an ArkiWatch database backup
  hosts: arkiwatch
  vars_files:
    - ../group_vars/prod.yml
  vars:
    arkiwatch_remote_root: "{{ arkiwatch_remote_root | default('/srv/arkiwatch') }}"
    arkiwatch_deploy_user: "{{ arkiwatch_deploy_user | default('deploy') }}"

  tasks:
    - name: Run backup script
      ansible.builtin.command:
        cmd: "{{ arkiwatch_remote_root }}/runtime/scripts/backup-db.sh"
      environment:
        ARKIWATCH_ROOT: "{{ arkiwatch_remote_root }}"
      register: arkiwatch_backup_result
      changed_when: true

    - name: Print backup result
      ansible.builtin.debug:
        var: arkiwatch_backup_result.stdout_lines
