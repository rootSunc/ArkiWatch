name: Bug report
description: Report a reproducible problem in ArkiWatch.
title: "[Bug]: "
labels:
  - bug
body:
  - type: textarea
    id: summary
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
      placeholder: The Today workspace shows ...
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: How can we reproduce it?
      description: Include the route, city/date selection, and smallest useful steps.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      placeholder: main or abc1234
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Today workspace
        - Data connector
        - API or database
        - Deployment or operations
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Remove tokens, personal data, and private hostnames before posting.
