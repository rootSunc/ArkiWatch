name: Feature request
description: Propose a focused improvement to the public-data platform.
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem should this solve?
      description: Describe the daily decision or contributor/operator need.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would you like to see?
      description: Explain the smallest useful version and how success could be measured.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Today workspace
        - New public data source
        - Recommendation or AI explanation
        - API or data model
        - Deployment or contributor experience
        - Other
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Add links, sketches, source terms, or examples if useful.
