<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1080" width="1600" height="1080" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="ArkiWatch architecture: public providers flow through collector adapters, raw observations, normalized events and snapshots, and Go rules into the Go API, which serves the Home and domain workspaces, Your day, and the assistant; Telegram delivery is optional.">
<title>How ArkiWatch works</title>
<defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4B5563"/></marker>
