<text x="1404" y="572" font-size="20" fill="#111827" font-weight="700" text-anchor="start"><tspan x="1404" dy="0">Assistant</tspan></text>
<text x="1348" y="642" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start"><tspan x="1348" dy="0">Answers cite the</tspan><tspan x="1348" dy="22">workspace they came from</tspan></text>
