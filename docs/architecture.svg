<text x="1169.0" y="538" font-size="21" fill="#111827" font-weight="700" text-anchor="middle"><tspan x="1169.0" dy="0">6b. Telegram</tspan></text>
<text x="1169.0" y="577" font-size="16" fill="#4B5563" font-weight="400" text-anchor="middle"><tspan x="1169.0" dy="0">Optional, off unless</tspan><tspan x="1169.0" dy="22">a bot token is set</tspan></text>
