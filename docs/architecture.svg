<text x="638.0" y="582" font-size="20" fill="#111827" font-weight="700" text-anchor="start"><tspan x="638.0" dy="0">Demo path</tspan></text>
<text x="638.0" y="610" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start"><tspan x="638.0" dy="0">Fixtures run through the same Go rules at</tspan><tspan x="638.0" dy="22">build time, so pnpm demo needs no API</tspan></text>
<rect x="36" y="730" width="560" height="300" rx="18" fill="#FFFFFF" stroke="#E2E6EF" stroke-width="2"/>
<text x="64" y="776" font-size="22" fill="#111827" font-weight="700" text-anchor="start"><tspan x="64" dy="0">Key characteristics</tspan></text>
<g transform="translate(46,807) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g>
<text x="78" y="822" font-size="17" fill="#374151" font-weight="400" text-anchor="start"><tspan x="78" dy="0">One isolated adapter per external API</tspan></text>
<g transform="translate(46,841) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g>
<text x="78" y="856" font-size="17" fill="#374151" font-weight="400" text-anchor="start"><tspan x="78" dy="0">Raw records keep source and fetch time</tspan></text>
<g transform="translate(46,875) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g>
<text x="78" y="890" font-size="17" fill="#374151" font-weight="400" text-anchor="start"><tspan x="78" dy="0">Validity comes from Go, not the browser clock</tspan></text>
<g transform="translate(46,909) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g>
<text x="78" y="924" font-size="17" fill="#374151" font-weight="400" text-anchor="start"><tspan x="78" dy="0">Demo, past dates, and live stay labelled apart</tspan></text>
<g transform="translate(46,943) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g>
<text x="78" y="958" font-size="17" fill="#374151" font-weight="400" text-anchor="start"><tspan x="78" dy="0">Missing or stale data is shown, never hidden</tspan></text>
<g transform="translate(46,977) scale(0.85)" fill="none" stroke="#16A34A" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6L9 17l-5-5"/></g>
<text x="78" y="992" font-size="17" fill="#374151" font-weight="400" text-anchor="start"><tspan x="78" dy="0">Assistant and Telegram are optional</tspan></text>
