<text x="124.0" y="298" font-size="21" fill="#111827" font-weight="700" text-anchor="middle"><tspan x="124.0" dy="0">1. Public</tspan><tspan x="124.0" dy="27">providers</tspan></text>
<text x="124.0" y="364" font-size="16" fill="#4B5563" font-weight="400" text-anchor="middle"><tspan x="124.0" dy="0">FMI, HSY, HSL,</tspan><tspan x="124.0" dy="22">Digitraffic, Fingrid,</tspan><tspan x="124.0" dy="22">SYKE, city APIs</tspan></text>
<rect x="238" y="180" width="176" height="300" rx="18" fill="#F7F8FC" stroke="#E2E6EF" stroke-width="2"/>
<rect x="298.0" y="204.0" width="56" height="56" rx="14" fill="#E7F6EC"/>
<g transform="translate(311.0,217.0) scale(1.25)" fill="none" stroke="#16A34A" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 2v6M15 2v6M6 8h12v3a6 6 0 0 1-12 0zM12 17v5"/></g>
<text x="326.0" y="298" font-size="21" fill="#111827" font-weight="700" text-anchor="middle"><tspan x="326.0" dy="0">2. Collector</tspan><tspan x="326.0" dy="27">adapters</tspan></text>
<text x="326.0" y="364" font-size="16" fill="#4B5563" font-weight="400" text-anchor="middle"><tspan x="326.0" dy="0">One Go adapter</tspan><tspan x="326.0" dy="22">per API, each run</tspan><tspan x="326.0" dy="22">keeps fetch metadata</tspan></text>
<rect x="440" y="180" width="176" height="300" rx="18" fill="#F7F8FC" stroke="#E2E6EF" stroke-width="2"/>
<rect x="500.0" y="204.0" width="56" height="56" rx="14" fill="#FFF3E2"/>
<g transform="translate(513.0,217.0) scale(1.25)" fill="none" stroke="#E07B00" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8zM14 2v6h6"/></g>
<text x="528.0" y="298" font-size="21" fill="#111827" font-weight="700" text-anchor="middle"><tspan x="528.0" dy="0">3. Raw</tspan><tspan x="528.0" dy="27">observations</tspan></text>
<text x="528.0" y="364" font-size="16" fill="#4B5563" font-weight="400" text-anchor="middle"><tspan x="528.0" dy="0">Stored as fetched</tspan><tspan x="528.0" dy="22">in PostgreSQL,</tspan><tspan x="528.0" dy="22">retention bounded</tspan></text>
<rect x="642" y="180" width="176" height="300" rx="18" fill="#F7F8FC" stroke="#E2E6EF" stroke-width="2"/>
<rect x="702.0" y="204.0" width="56" height="56" rx="14" fill="#E8F1FF"/>
<g transform="translate(715.0,217.0) scale(1.25)" fill="none" stroke="#2563EB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.7 4 3 9 3s9-1.3 9-3V5M3 12c0 1.7 4 3 9 3s9-1.3 9-3"/></g>
<text x="730.0" y="298" font-size="21" fill="#111827" font-weight="700" text-anchor="middle"><tspan x="730.0" dy="0">4. Events &amp;</tspan><tspan x="730.0" dy="27">snapshots</tspan></text>
<text x="730.0" y="364" font-size="16" fill="#4B5563" font-weight="400" text-anchor="middle"><tspan x="730.0" dy="0">Normalized,</tspan><tspan x="730.0" dy="22">deduplicated, with</tspan><tspan x="730.0" dy="22">validity windows</tspan></text>
<rect x="844" y="180" width="176" height="300" rx="18" fill="#F7F8FC" stroke="#E2E6EF" stroke-width="2"/>
<rect x="904.0" y="204.0" width="56" height="56" rx="14" fill="#F2ECFF"/>
<g transform="translate(917.0,217.0) scale(1.25)" fill="none" stroke="#7C3AED" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10zM9 12l2 2 4-4"/></g>
<text x="932.0" y="298" font-size="21" fill="#111827" font-weight="700" text-anchor="middle"><tspan x="932.0" dy="0">5. Rules &amp; read</tspan><tspan x="932.0" dy="27">models</tspan></text>
<text x="932.0" y="364" font-size="16" fill="#4B5563" font-weight="400" text-anchor="middle"><tspan x="932.0" dy="0">Deterministic Go;</tspan><tspan x="932.0" dy="22">no model in the</tspan><tspan x="932.0" dy="22">decision path</tspan></text>
