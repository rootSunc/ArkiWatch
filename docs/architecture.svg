<text x="1148.0" y="818" font-size="17.5" fill="#111827" font-weight="700" text-anchor="start"><tspan x="1148.0" dy="0">Storage</tspan></text>
<text x="1148.0" y="841" font-size="15" fill="#4B5563" font-weight="400" text-anchor="start"><tspan x="1148.0" dy="0">PostgreSQL, pgx, Go-owned schema</tspan></text>
