<rect width="1600" height="1080" rx="24" fill="#FFFFFF"/>
<text x="800.0" y="62" font-size="38" fill="#111827" font-weight="800" text-anchor="middle"><tspan x="800.0" dy="0">How ArkiWatch works</tspan></text>
<text x="800.0" y="98" font-size="19" fill="#6B7280" font-weight="400" text-anchor="middle"><tspan x="800.0" dy="0">From public feeds to one next step, with the evidence kept visible</tspan></text>
<rect x="36" y="180" width="176" height="300" rx="18" fill="#F7F8FC" stroke="#E2E6EF" stroke-width="2"/>
<rect x="96.0" y="204.0" width="56" height="56" rx="14" fill="#EEF0FF"/>
