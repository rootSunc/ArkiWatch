<text x="1404" y="172" font-size="20" fill="#111827" font-weight="700" text-anchor="start"><tspan x="1404" dy="0">Home &amp; domain</tspan><tspan x="1404" dy="25">workspaces</tspan></text>
<text x="1348" y="248" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start"><tspan x="1348" dy="0">Recommendation, signals,</tspan><tspan x="1348" dy="22">and evidence for each value</tspan></text>
