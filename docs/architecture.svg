<text x="130" y="582" font-size="20" fill="#111827" font-weight="700" text-anchor="start"><tspan x="130" dy="0">Scheduler</tspan></text>
<text x="130" y="610" font-size="16" fill="#4B5563" font-weight="400" text-anchor="start"><tspan x="130" dy="0">Runs collect → normalize → rules →</tspan><tspan x="130" dy="22">snapshots → dispatch, with jobs in PostgreSQL</tspan></text>
<path d="M538.0 550V630" stroke="#E5E7EB" stroke-width="2"/>
<rect x="573.0" y="565.0" width="50" height="50" rx="14" fill="#FFF3E2"/>
