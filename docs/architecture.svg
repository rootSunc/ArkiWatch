<text x="1169.0" y="248" font-size="21" fill="#111827" font-weight="700" text-anchor="middle"><tspan x="1169.0" dy="0">6a. Go HTTP API</tspan></text>
<text x="1169.0" y="287" font-size="16" fill="#4B5563" font-weight="400" text-anchor="middle"><tspan x="1169.0" dy="0">REST behind a static</tspan><tspan x="1169.0" dy="22">OpenAPI contract that</tspan><tspan x="1169.0" dy="22">types the web client</tspan></text>
<rect x="1074" y="420" width="190" height="230" rx="18" fill="#EEF8F2" stroke="#CBE7D5" stroke-width="2"/>
